baseURL = "https://blog.aukovien.com/"
languageCode = "en-us"
title = "Aukovien // Writing"
theme = "PaperMod"
summaryLength = 20

[pagination]
  pagerSize = 10

enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  author = "Anar Enkhzol"
  description = "Writing on security, reverse engineering, and tooling."
  keywords = ["security", "ctf", "reverse engineering", "osint"]
  DateFormat = "Jan 2006"
  # "auto" honours prefers-color-scheme; PaperMod's inline head script resolves
  # it to data-theme before first paint, so there is no flash.
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  hidemeta = false
  hideSummary = false
  comments = false

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/safari-pinned-tab.svg"
    theme_color = "#0c130c"
    msapplication_TileColor = "#0c130c"

  [params.homeInfoParams]
    Title = "writing"
    Content = "notes on security, reverse engineering, and building things."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/aukovien"

  [[params.socialIcons]]
    name = "hackthebox"
    url = "https://app.hackthebox.com/public/users/1459139"

[menu]
  [[menu.main]]
    identifier = "back"
    name = "aukovien.com"
    url = "https://aukovien.com"
    weight = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    # No `style` here on purpose: with noClasses = false Chroma emits classes
    # and the colours come from CSS, not from a named Chroma style. The token
    # palette lives in assets/css/extended/custom.css.

[outputs]
  # JSON was building an ~18KB Fuse.js index for a search page that does not
  # exist. Re-add "JSON" here alongside a content/search.md if search is ever
  # wanted.
  home = ["HTML", "RSS"]
